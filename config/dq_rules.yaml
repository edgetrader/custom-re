# Data quality rules for the Custom RE quarterly KPI extract.
# Tolerances are absolute (fractions, e.g. 0.005 = 0.5 percentage points).

# reporting_date is not set here: app/run_dq.py derives it from the period argument
# (quarter end), so this file does not change each quarter.

# The expected fund universe is not set here either: app/run_dq.py sets expected_fund_count to the
# number of funds in the GP reference file (see config/settings.yaml), the single list of expected funds.

valid_currencies: [AUD, EUR, GBP, HKD, JPY, NOK, SGD, USD]

# Datapoints per category and the value field each must use (num | date | str).
datapoints:
  Fund Info:
    AIA Effective Interest in Fund: num
    Assets under development: num
    Bad debts: num
    Base fee incurred to-date: num
    Carried interest incurred to-date: num
    Completed assets: num
    End of fund term: date
    End of investment period: date
    Fund GAV: num
    Fund LTV (current): num
    Fund LTV Cap: num
    Fund NAV: num
    Fund Since Inception Net IRR: num
    Fund Target Net IRR: num
    Fund inception date: date
    Portfolio average occupancy rate: num
    Proportion of fixed rate debt: num
    Start of fund term: date
    Start of investment period: date
    Weighted average cost of debt: num
  GAV Composition:
    Cash & Near Cash: num
    Others: num
    Real Estate Investments (Immovable Property): num
  Exposure - Geography:
    Country: str
    Country Percentage: num
    Region Level 1: str
    Region Level 2: str
  Exposure - Sector:
    Sector - level 1: str
    Sector - level 2: str
    Portfolio sector percentage (by GAV) - total portfolio: num
    Portfolio sector percentage (by GAV) - total portfolio Sector Level 1: num
    Average occupancy rate (%) - completed assets Sector Level 1: num
    Average occupancy rate (%) - completed assets Sector Level 2: num
  Debt Maturity:
    Debt maturity value: num
  Projection:
    Capital call amount: num
    Distribution amount: num

# Missing datapoints. Funds are not expected to report every datapoint: a datapoint a fund does not
# report, or reports with no value (blank, null or NA), is a completeness gap listed per datapoint
# and fund (info), not an error.
# A datapoint listed here means "none" when it is missing or has no value, so it is not a gap; the
# text describes those funds in the reports. A zero means none too.
none_when_missing:
  Bad debts: No bad debt

# Stage 1: completeness tiers per fund (1 best, 4 worst). "Answered" means a datapoint has a value,
# a zero, or "none" (see none_when_missing); a datapoint with an error counts as an error datapoint.
# A fund takes the best tier whose every condition it meets; funds missing from the extract are tier 4.
# Stage 2 (usability per fund and datapoint) covers tiers up to analysis_max_tier.
tiers:
  labels: {1: Complete, 2: Substantially complete, 3: Partial, 4: Insufficient}
  # Datapoints a fund must answer to reach tier 1 or 2. Empty until a core list is agreed.
  core_datapoints: []
  tier1: {min_answered: 1.0, max_error_datapoints: 0}
  # all_categories: every category has at least one answered datapoint.
  tier2: {min_answered: 0.9, max_error_datapoints: 1, all_categories: true}
  tier3: {min_answered: 0.7}
  analysis_max_tier: 2

# Forward-looking calendars, derived from reporting_date so they roll each quarter.
# Each is `periods` period-ends of pandas `freq` (YE/QE/ME) strictly after the reporting
# date, after skipping the first `skip` of them.
debt_maturity_calendar: {freq: YE, periods: 10, skip: 0}
# A fund's projection dates must match exactly one of these calendars.
# Monthly projections in the 2026Q2 extract start in August, so the first month-end is skipped.
projection_calendars:
  monthly: {freq: ME, periods: 18, skip: 1}
  quarterly: {freq: QE, periods: 6, skip: 0}

# Ratios that must lie in [0, 1].
fraction_datapoints:
  - AIA Effective Interest in Fund
  - Assets under development
  - Completed assets
  - Fund LTV (current)
  - Fund LTV Cap
  - Portfolio average occupancy rate
  - Proportion of fixed rate debt
  - Weighted average cost of debt
  - Cash & Near Cash
  - Others
  - Real Estate Investments (Immovable Property)
  - Country Percentage
  - Portfolio sector percentage (by GAV) - total portfolio
  - Portfolio sector percentage (by GAV) - total portfolio Sector Level 1
  - Average occupancy rate (%) - completed assets Sector Level 1
  - Average occupancy rate (%) - completed assets Sector Level 2

# Currency amounts that must be non-negative.
amount_datapoints:
  - Bad debts
  - Base fee incurred to-date
  - Carried interest incurred to-date
  - Fund GAV
  - Fund NAV
  - Debt maturity value
  - Capital call amount
  - Distribution amount

# Plausibility bounds (warnings, not hard errors).
irr_bounds: [-0.5, 0.5]
max_bad_debt_to_gav: 0.01
max_fees_to_gav: 0.15

# Allowed labels.
region_continents: [Americas, Asia Pacific, Europe]
sector_level1: [Industrial, Office, Others, Residential, Retail]

# Fund-life dates must be in this order (each pair: earlier <= later).
date_order:
  - [Fund inception date, Start of fund term]
  - [Start of fund term, Start of investment period]
  - [Start of investment period, End of investment period]
  - [End of investment period, End of fund term]

tolerances:
  sum_to_one: 0.005          # mix percentages summing to 100%
  rollup: 0.005              # sector L2 -> L1 aggregation
  lifecycle_split: 0.005     # completed + under development = 1
  occupancy_weighted: 0.02   # fund occupancy vs GAV-weighted sector occupancy
  ltv_vs_nav_gap: 0.005      # LTV may exceed 1 - NAV/GAV by at most this
  debt_vs_ltv_low: 0.8       # total debt maturities / (LTV x GAV)
  debt_vs_ltv_high: 1.2

# IQR multiplier for cross-fund outlier detection.
outlier_iqr_k: 1.5
outlier_metrics:
  - Fund LTV (current)
  - Fund Since Inception Net IRR
  - Portfolio average occupancy rate
  - Weighted average cost of debt
  - Proportion of fixed rate debt
  - nav_to_gav
  - fees_to_gav
  - bad_debt_to_gav

# Management HTML report: thresholds and wording that are business knowledge, not code.
report:
  ltv_headroom: 0.05              # LTV within this of its cap is called out
  exact_rel_tol: 1.0e-9           # amounts: "derived, not reported" test for exact agreement
  exact_share_tol: 1.0e-4         # shares: agreement within 0.01 points, allowing for rounding
  anonymised_label_pattern: '^Country \d+$'
  reconcile_sample: 3 to 5        # funds to reconcile against manager reports
  # Source columns that are expected to be empty, with what their absence means.
  empty_field_notes:
    Scenario: Actual and forecast values cannot be told apart.
    Version: Restatements cannot be told apart.
    Period: Frequency has to be inferred from dates.
    Reporting Period: The reporting date is populated and used instead.
    Region: Geography comes from the exposure records instead.
    Nature: ""
    Analysis4: Analysis 1 to 3 carry all dimensions.
    Value Memo: No commentary is supplied with any value.
